# =====================================================================
# Cloudflare Workers 設定（mirai-sales-pipeline）
# - ビルドは scripts/build-worker.mjs が worker-build/worker.mjs に単一バンドルを生成
# - デプロイは scripts/deploy.mjs（Cloudflare REST API 直接）または wrangler deploy で実行
# - シークレット（DATABASE_URL / SESSION_SECRET / CRON_SECRET）は
#   Cloudflare Dashboard > Workers > mirai-sales-pipeline > Settings > Variables and Secrets で管理
#   （wrangler secret put または scripts/deploy.mjs の --secrets オプション）
# =====================================================================

name = "mirai-sales-pipeline"
main = "worker-build/worker.mjs"
compatibility_date = "2026-08-16"

# workers.dev サブドメイン（https://mirai-sales-pipeline.<account-subdomain>.workers.dev）
workers_dev = true

[vars]
APP_NAME = "mirai-sales-pipeline"
ENVIRONMENT = "production"

# 日次ジョブ（JOB-01〜06）: 毎日 00:30 UTC = 09:30 JST
[triggers]
crons = ["30 0 * * *"]

[observability]
enabled = true
